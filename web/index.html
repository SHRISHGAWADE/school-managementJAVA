<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Valley High School — Academic ERP & Governance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-wrapper">
    
    <!-- Persistent Dark-Green Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="school-badge">ACADEMIC ERP</span>
        <h1 class="school-name" id="school-title">Green Valley High</h1>
      </div>

      <nav class="sidebar-nav">
        <!-- 1. Dashboard -->
        <button class="nav-btn active" data-view="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span>Dashboard</span>
        </button>

        <!-- 2. Students -->
        <button class="nav-btn" data-view="students">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
          </svg>
          <span>Students</span>
        </button>

        <!-- 3. Teachers -->
        <button class="nav-btn" data-view="teachers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span>Teachers</span>
        </button>

        <!-- 4. Finance & Fees -->
        <button class="nav-btn" data-view="finance">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Finance & Fees</span>
        </button>

        <!-- 5. Academics -->
        <button class="nav-btn" data-view="academics">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <span>Academics</span>
        </button>

        <!-- 6. Attendance -->
        <button class="nav-btn" data-view="attendance">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          <span>Attendance</span>
        </button>

        <!-- 7. Results -->
        <button class="nav-btn" data-view="results">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span>Results</span>
        </button>

        <!-- 8. Timetable -->
        <button class="nav-btn" data-view="timetable">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span>Timetable</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="system-status-pill">
          <span class="status-dot"></span>
          <span>Java SE Backend Active</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- 1. Dashboard View -->
      <div id="view-dashboard">
        <header class="editorial-topbar">
          <div>
            <p class="eyebrow">Academic Operations & Governance</p>
            <h2 class="hero-heading">Institutional Overview</h2>
            <p class="subheading">Audited financial posture, cohort headcounts, and live operational activity.</p>
          </div>
          <button id="refresh-dashboard-btn" class="btn-refresh" title="Refresh Live Data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>Sync Data</span>
          </button>
        </header>

        <div id="dashboard-content">
          <!-- Dynamic Content Rendered by dashboard.js -->
        </div>
      </div>

      <!-- 2. Students View -->
      <div id="view-students" style="display: none;">
        <!-- Dynamic Content Rendered by students.js -->
      </div>

      <!-- 3. Teachers View -->
      <div id="view-teachers" style="display: none;">
        <!-- Dynamic Content Rendered by teachers.js -->
      </div>

      <!-- 4. Finance & Fees View -->
      <div id="view-finance" style="display: none;"></div>

      <!-- Student Attendance View -->
      <div id="view-attendance" style="display: none;"></div>

      <!-- Exam Results View -->
      <div id="view-results" style="display: none;"></div>

      <!-- Timetable View -->
      <div id="view-timetable" style="display: none;"></div>

      <!-- Academic Years and Class Structure View -->
      <div id="view-academics" style="display: none;"></div>

      <!-- 4. Placeholder View for Upcoming Stages -->
      <div id="view-placeholder" style="display: none;">
        <!-- Temporary views rendered by app.js -->
      </div>

    </main>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
